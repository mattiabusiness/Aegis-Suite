<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Aegis Beauty</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 32px;
    }
    .logo-wrap {
      width: 80px;
      height: 80px;
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid rgba(124, 58, 237, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-wrap svg {
      width: 40px;
      height: 40px;
      color: #a78bfa;
    }
    .content {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    p {
      font-size: 0.9375rem;
      color: #94a3b8;
      line-height: 1.6;
    }
    button {
      margin-top: 8px;
      padding: 14px 28px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover { background: #6d28d9; }
    button:active { background: #5b21b6; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
  </div>
  <div class="content">
    <h1>Sei offline</h1>
    <p>Controlla la connessione e riprova.</p>
    <button onclick="window.location.reload()">Riprova</button>
  </div>
</body>
</html>
